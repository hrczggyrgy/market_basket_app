name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/unit -v --tb=short -q --cov=src/analytics --cov-fail-under=60 --cov-report=term-missing

      - name: Verify imports
        run: |
          python -c "from src.analytics import *; from src.ui import *; print('All imports OK')"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          ruff check src/ tests/ --output-format=github
          ruff format --check src/ tests/

      - name: Run MyPy type checker
        run: |
          mypy src/ --check-untyped-defs --ignore-missing-imports