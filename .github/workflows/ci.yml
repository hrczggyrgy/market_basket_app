name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ruff check
        run: uv run ruff check src tests --output-format=github
      - name: Run ruff format check
        run: uv run ruff format --check src tests

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev --extra advanced
      - name: Run mypy
        run: uv run mypy src --strict --check-untyped-defs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev --extra advanced
      - name: Run unit tests
        run: uv run pytest tests/unit -x -q --tb=short -k "not slow"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev --extra advanced
      - name: Run integration tests
        run: uv run pytest tests/unit -x -q --tb=short -k "slow"

  performance-smoke:
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev --extra advanced
      - name: Run performance smoke test
        run: |
          uv run python scripts/benchmark.py --size 10000 --output benchmarks/ci-baseline.json
          uv run python scripts/check_performance.py --check-budgets benchmarks/ci-baseline.json

  performance-regression:
    name: Performance Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev --extra advanced
      - name: Run performance baseline on main
        run: |
          git fetch origin main
          git stash
          git checkout origin/main
          uv run python scripts/benchmark.py --size 10000 --output benchmarks/main-baseline.json
          git checkout -
          git stash pop
      - name: Run performance on PR branch
        run: |
          uv run python scripts/benchmark.py --size 10000 --output benchmarks/pr-baseline.json
      - name: Compare performance
        run: |
          uv run python scripts/check_performance.py --check-regression benchmarks/main-baseline.json benchmarks/pr-baseline.json