name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -q

      - name: Verify imports
        run: |
          python -c "from src.analytics import *; from src.models import *; from src.ui import *; print('All imports OK')"

  run-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run CDT validation benchmark
        run: |
          python -c "
from src.analytics.cdt_validation import run_cdt_validation
result = run_cdt_validation(n_samples=50, n_features=10, n_clusters=3)
print('CDT validation complete:', result)
assert 'ari' in result.columns and 'nmi' in result.columns
min_ari = result['ari'].min()
min_nmi = result['nmi'].min()
print(f'Min ARI: {min_ari:.3f}, Min NMI: {min_nmi:.3f}')
assert min_ari > 0.5, f'ARI below threshold: {min_ari}'
assert min_nmi > 0.5, f'NMI below threshold: {min_nmi}'
          "

      - name: Run Segmentation validation benchmark
        run: |
          python -c "
from src.analytics.segmentation_validation import run_segmentation_validation
result = run_segmentation_validation(n_customers=100, n_true_segments=3)
print('Segmentation validation complete:', result)
assert 'adjusted_rand_index' in result.columns and 'normalized_mutual_info' in result.columns
min_ari = result['adjusted_rand_index'].min()
min_nmi = result['normalized_mutual_info'].min()
print(f'Min ARI: {min_ari:.3f}, Min NMI: {min_nmi:.3f}')
assert min_ari > 0.5, f'Segmentation ARI below threshold: {min_ari}'
assert min_nmi > 0.5, f'Segmentation NMI below threshold: {min_nmi}'
          "

      - name: Run Promo detection validation benchmark
        run: |
          python -c "
from src.analytics.promotional_validation import run_promo_detection_validation
result = run_promo_detection_validation(n_transactions=500, n_products=10)
print('Promo validation complete:', result)
assert 'method' in result.columns and 'f1' in result.columns
min_f1 = result['f1'].min()
print(f'Min F1: {min_f1:.3f}')
assert min_f1 > 0.5, f'Promo F1 below threshold: {min_f1}'
          "

      - name: Run Elasticity validation benchmark
        run: |
          python -c "
from src.analytics.validation import run_validation
result = run_validation(n_skus=15, n_weeks=26, n_categories=3, n_samples=200)
print('Elasticity validation complete:', result)
assert 'rmse' in result.columns and 'bias' in result.columns
min_rmse = result['rmse'].min()
print(f'Best RMSE: {min_rmse:.4f}')
# Just check it runs and produces reasonable numbers
assert len(result) > 0, 'No validation results'
          "

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check src/ tests/ --output-format=github
          ruff format --check src/ tests/