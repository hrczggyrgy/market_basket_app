[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-basket-app"
version = "2.0.0"
description = "Market Basket Analysis and Customer Decision Intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.59.1",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "plotly==6.9.0",
    "duckdb",
    "pyarrow",
    "psutil>=7.2.2",
    "xxhash==3.5.0",
    "networkx==3.6.1",
    "mlxtend==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-xdist>=3.5.0",
    "kaleido>=0.2.1",
    "playwright>=1.40.0",
    "pixelmatch>=0.4.0",
    "hypothesis>=6.90.0",
]
advanced = [
    "statsmodels==0.14.6",
    "lifelines==0.30.3",
    "lifetimes==0.11.3",
    "linearmodels==5.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B006", "B904", "SIM108", "UP006", "UP007", "UP035", "UP045"]
fixable = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = ".mypy_stubs"
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
# Third-party libraries without shipped stubs are treated as Any.
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short -n auto"
markers = [
    "slow: marks tests as slow",
    "e2e: end-to-end AppTest sweep",
    "env: clean-venv import test",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[dependency-groups]
dev = [
    "pixelmatch>=0.4.0",
]
